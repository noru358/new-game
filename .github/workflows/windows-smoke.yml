name: Windows export startup smoke

on:
  pull_request:
    paths:
      - '.github/workflows/windows-smoke.yml'
      - 'scripts/windows_export_smoke.py'
      - 'scripts/windows_preview_contract.py'
      - 'scripts/test_windows_preview_contract.py'
      - '.github/playtest-version'
      - 'scripts/launch_price_trial.py'
      - 'tests/test_price_trial_launcher.py'
      - 'tests/price_trial_probe.gd'
      - 'project.godot'
      - 'export_presets.cfg'
      - 'game/**'
      - 'assets/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-smoke-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

jobs:
  export-startup:
    runs-on: windows-2022
    timeout-minutes: 15
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify preview isolation and config contracts
        shell: pwsh
        run: python scripts/test_windows_preview_contract.py
      - name: Export and start the Windows release executable
        shell: pwsh
        run: >-
          python scripts/windows_export_smoke.py
          --workspace "$env:GITHUB_WORKSPACE"
          --scratch "$env:RUNNER_TEMP/new-game-windows-smoke"
          --report "$env:RUNNER_TEMP/new-game-windows-smoke-report"
          --commit "$env:SOURCE_SHA"
          --preview-label "$(Get-Content .github/playtest-version)"
      - name: Verify isolated price-trial copies on Windows
        shell: pwsh
        run: >-
          python tests/test_price_trial_launcher.py
          --godot "$env:RUNNER_TEMP/new-game-windows-smoke/editor/Godot_v4.6-stable_win64_console.exe"
          --work-dir "$env:RUNNER_TEMP/price-trial-checks"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-smoke-${{ env.SOURCE_SHA }}
          path: |
            ${{ runner.temp }}/new-game-windows-smoke-report/
            ${{ runner.temp }}/price-trial-checks/engine-summary.json
            ${{ runner.temp }}/price-trial-checks/*/*.log
          retention-days: 3
          if-no-files-found: error

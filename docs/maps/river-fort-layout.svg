<text x="44" y="703" fill="#183b3e" font-family="Noto Sans CJK KR, sans-serif" font-size="23">녹색 선: 제방 / 시설 안쪽의 지면 연결 · 작은 다리망을 반복하지 않음</text>
<text x="44" y="741" fill="#183b3e" font-family="Noto Sans CJK KR, sans-serif" font-size="23">둔치에서 강이 드러남 → 나루 접근 → 열린 요새 마당. 배는 조작하지 않음.</text>
<text x="44" y="779" fill="#183b3e" font-family="Noto Sans CJK KR, sans-serif" font-size="23">독립 출정은 선택 화면 가정. 길이·보스·보상·최종 해금 조건은 아직 미정.</text>
<text x="44" y="835" fill="#567174" font-family="Noto Sans CJK KR, sans-serif" font-size="18">설계 배치도 · 사선 게임 시점 유지 · 좌표/시야는 블록아웃 시험값</text>
